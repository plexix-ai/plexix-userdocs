# Secret scan on every PR: the "Gitleaks check passes" merge gate (CLAUDE.md, Changes).
# Scans the full git history, which takes under a second at this repo's size. Runs the
# Gitleaks release binary, checksum-verified, instead of gitleaks-action, which needs a licence
# key on organisation repos. --redact keeps any finding's value out of the job log.
name: gitleaks

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt (2026-11-22).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks

      - name: Scan history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
